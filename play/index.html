<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PPL8S80G71"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-PPL8S80G71');

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <meta name="description" content="Play Taipei GTA online in the browser." />
    <link rel="icon" href="/icons/icon.svg" />
    <title>Play Taipei GTA · 臺北狂飆</title>
    <style>
      :root{color-scheme:dark;font-family:Arial,"PingFang TC","Microsoft JhengHei",sans-serif;background:#07080c;color:#f4f1ea}
      *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07080c}body{position:fixed;inset:0}
      .stage{position:fixed;inset:0;background:#07080c;display:grid;place-items:center}.game{width:100vw;height:100vh;border:0;background:#07080c}.topbar{position:fixed;left:18px;right:18px;top:14px;z-index:5;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{color:#fff;text-decoration:none;font-weight:800;letter-spacing:.08em;font-size:14px;text-shadow:0 2px 12px #000}.brand b{color:#e32638}.actions{pointer-events:auto;display:flex;gap:8px}.actions button{border:1px solid #ffffff44;border-radius:4px;background:#090b10cc;color:#fff;padding:9px 13px;display:inline-flex;gap:7px;align-items:center;font-weight:700;cursor:pointer;backdrop-filter:blur(10px)}.actions button:hover{background:#e32638;border-color:#ff6570}.hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:5;padding:8px 12px;background:#090b10b8;border:1px solid #ffffff24;border-radius:4px;color:#d7d3cf;font-size:11px;pointer-events:none;white-space:nowrap}@media(max-width:600px){.topbar{left:10px;right:10px;top:10px}.brand{font-size:11px}.actions button{padding:7px 9px;font-size:11px}.hint{font-size:10px;max-width:90vw;overflow:hidden;text-overflow:ellipsis}}
    </style>
  </head>
  <body>
    <div class="stage"><iframe id="game" class="game" src="https://www.taipei-rush.app/" title="Taipei GTA game" allow="autoplay; fullscreen; gamepad; clipboard-write" allowfullscreen></iframe></div>
    <div class="topbar"><a class="brand" href="/">TAIPEI<span><b>GTA</b>.IO</span></a><div class="actions"><button id="fullscreen" type="button">⛶ 全屏</button></div></div>
    <div class="hint">点击“全屏”进入游戏；按 Esc 返回当前页面</div>
    <script>const frame=document.getElementById('game');document.getElementById('fullscreen').addEventListener('click',()=>frame.requestFullscreen?.());</script>
  </body>
